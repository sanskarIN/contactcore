name: CI
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ContactCore.slnx
      - name: Format check
        run: dotnet format ContactCore.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ContactCore.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ContactCore.slnx -c Release --no-build --collect:"XPlat Code Coverage"
