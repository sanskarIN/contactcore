name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ContactCore.slnx

      - name: Format check
        run: dotnet format ContactCore.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ContactCore.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ContactCore.slnx -c Release --no-build --collect:"XPlat Code Coverage"
