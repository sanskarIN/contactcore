name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ContactCore.slnx
      - run: dotnet test ContactCore.slnx -c Release --no-restore
      - run: dotnet publish src/ContactCore.Desktop/ContactCore.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: contactcore-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in artifacts/contactcore-*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            (cd "$dir" && zip -q -r "../../release-assets/${name}.zip" .)
          done
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
      - name: Show release assets
        run: find release-assets -maxdepth 1 -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
