name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ContactCore.slnx
      - run: dotnet build ContactCore.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@v3
