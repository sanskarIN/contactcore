name: Bug report
description: Report a reproducible ContactCore defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: What happened?, description: Do not attach a database containing real contacts. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: ContactCore version }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [Windows, macOS, Linux] }
    validations: { required: true }
